name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  MISE_CARGO_BINSTALL_ONLY: "1"

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    
    strategy: 
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - run: git config --system core.longpaths true
        if: runner.os == 'Windows'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
      - name: Workaround for duckdb
        shell: python
        run: |
          import os
          import glob 
          import shutil 
          for path in glob.glob("target/debug/build/libduckdb*"):
            print(f"Removing {path}\n")
            shutil.rmtree(path)
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - name: Install
        run: just install
      - name: Check
        run: just check
      - name: Test
        run: just test
      - name: Fix DuckDB library path for macOS coverage
        if: runner.os == 'macOS'
        run: |
          DUCKDB_LIB=$(find target/duckdb-download -name "libduckdb.dylib" | head -1)
          if [ -z "$DUCKDB_LIB" ]; then
            echo "Error: libduckdb.dylib not found in target/duckdb-download"
            echo "Available files:"
            find target/duckdb-download -type f 2>/dev/null || echo "target/duckdb-download directory not found"
            exit 1
          fi
          mkdir -p target/llvm-cov-target/debug
          cp "$DUCKDB_LIB" target/llvm-cov-target/debug/libduckdb.dylib
          echo "Successfully copied $DUCKDB_LIB to target/llvm-cov-target/debug/libduckdb.dylib"
      - name: Test with coverage
        run: just test-coverage
      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: covertura.xml
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: target/nextest/default/junit.xml
          report_type: test_results
          fail_ci_if_error: true
      - name: Format
        run: just fmt
      - run: git add . && git diff
      - run: git diff --cached
      - name: Ensure no files have changed
        run: git add . && git diff --quiet && git diff --cached --quiet
