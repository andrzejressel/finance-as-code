name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  MISE_CARGO_BINSTALL_ONLY: "1"

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    
    strategy: 
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - run: git config --system core.longpaths true
        if: runner.os == 'Windows'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Workaround for duckdb
        shell: python
        run: |
          import os
          import glob 
          import shutil 
          for path in glob.glob("target/debug/build/libduckdb*"):
            print(f"Removing {path}\n")
            shutil.rmtree(path)
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
      - name: Install
        run: just install
      - name: Check
        run: just check
      - name: Test
        run: just test
      - name: Fix DuckDB library path for macOS coverage
        if: runner.os == 'macOS'
        run: |
          DUCKDB_LIB=$(find target/duckdb-download -name "libduckdb.dylib" | head -1)
          if [ -z "$DUCKDB_LIB" ]; then
            echo "Error: libduckdb.dylib not found in target/duckdb-download"
            echo "Available files:"
            find target/duckdb-download -type f 2>/dev/null || echo "target/duckdb-download directory not found"
            exit 1
          fi
          mkdir -p target/llvm-cov-target/debug
          cp "$DUCKDB_LIB" target/llvm-cov-target/debug/libduckdb.dylib
          echo "Successfully copied $DUCKDB_LIB to target/llvm-cov-target/debug/libduckdb.dylib"
      - name: Test with coverage
        run: just test-coverage
      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          files: covertura.xml
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: target/nextest/default/junit.xml
          fail_ci_if_error: true
      - name: Format
        run: just fmt
      - run: git add . && git diff
      - run: git diff --cached
      - name: Ensure no files have changed
        run: git add . && git diff --quiet && git diff --cached --quiet
